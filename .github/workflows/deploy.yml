name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The public PKCE client id is committed in .env.production so the
        # deployed site has Spotify without any repository configuration. A
        # VITE_SPOTIFY_CLIENT_ID secret still overrides it — but only when it is
        # actually set: an empty process env var outranks the .env file in Vite,
        # so exporting it unconditionally would silently disable Spotify.
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID_OVERRIDE" ]; then
            export VITE_SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID_OVERRIDE"
          fi
          npm run build
        env:
          VITE_BASE_PATH: /my_portfolio/
          SPOTIFY_CLIENT_ID_OVERRIDE: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
